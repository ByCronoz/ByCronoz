name: Gerar animação da cobrinha

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#ff4fa3&color_dots=#ebe4f5,#d9b8ff,#b66bff,#8a2be2,#5b1a9e&size_dot_border_radius=3
            dist/github-snake-dark.svg?color_snake=#ff4fa3&color_dots=#161022,#3b1d5a,#6a2fb0,#9d4edd,#c77dff&size_dot_border_radius=3

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
