name: Gerar perfil

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Gerar icones das organizacoes (cantos arredondados)
        env:
          ORGS: "nythric MilyBot"
        run: |
          python3 - <<'PYEOF'
          import base64, os, urllib.request

          ORGS = os.environ.get("ORGS", "nythric MilyBot").split()
          os.makedirs("dist", exist_ok=True)

          TEMPLATE = """<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 112 112" width="112" height="112" role="img" aria-label="__NAME__">
          <defs>
          <clipPath id="r"><rect x="4" y="4" width="104" height="104" rx="22"/></clipPath>
          <linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
          </defs>
          <style>
          .sh{animation:sw 4.5s ease-in-out infinite}
          @keyframes sw{0%{transform:translateX(-60px)}55%,100%{transform:translateX(130px)}}
          </style>
          <image href="data:__MIME__;base64,__B64__" xlink:href="data:__MIME__;base64,__B64__" x="4" y="4" width="104" height="104" clip-path="url(#r)" preserveAspectRatio="xMidYMid slice"/>
          <g clip-path="url(#r)"><rect class="sh" x="4" y="4" width="46" height="104" fill="url(#sh)"/></g>
          <rect x="4.5" y="4.5" width="103" height="103" rx="21.5" fill="none" stroke="#27272a" stroke-width="1"/>
          </svg>"""

          def fetch(org):
              req = urllib.request.Request("https://github.com/%s.png?size=208" % org, headers={"User-Agent": "profile-readme"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read()

          for org in ORGS:
              try:
                  data = fetch(org)
              except Exception as e:
                  print("AVISO: nao foi possivel baixar o avatar de", org, e)
                  continue
              mime = "image/jpeg" if data[:3] == b"\xff\xd8\xff" else "image/png"
              svg = (TEMPLATE.replace("__NAME__", org).replace("__MIME__", mime)
                     .replace("__B64__", base64.b64encode(data).decode()))
              with open("dist/org-%s.svg" % org.lower(), "w", encoding="utf-8") as f:
                  f.write(svg)
              print("ok:", org, len(svg), "bytes")
          PYEOF

      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#7c3aed&color_dots=#ebedf0,#ddd6fe,#a78bfa,#7c3aed,#5b21b6
            dist/github-snake-dark.svg?color_snake=#a78bfa&color_dots=#1c1c1f,#2e1065,#5b21b6,#7c3aed,#a78bfa

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
