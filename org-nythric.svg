<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 104 104" width="104" height="104" role="img" aria-label="nythric">
<defs>
<clipPath id="r"><rect width="104" height="104" rx="22"/></clipPath>
<linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs>
<style>
.sh{animation:sw 4.5s ease-in-out infinite}
@keyframes sw{0%{transform:translateX(-60px)}55%,100%{transform:translateX(130px)}}
</style>
<image href="data:image/png;base64," xlink:href="data:image/png;base64," width="104" height="104" clip-path="url(#r)" preserveAspectRatio="xMidYMid slice"/>
<g clip-path="url(#r)"><rect class="sh" width="46" height="104" fill="url(#sh)"/></g>
</svg>